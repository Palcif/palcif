query SitePages($language: LanguageCodeFilterEnum!) {
  pages(first: 100, where: { language: $language }) {
    nodes {
      id
      title
      content
      uri
      slug
      language
      translations {
        language
        slug
      }
      featuredImage {
        node {
          sourceUrl
          altText
          mediaDetails {
            width
            height
          }
        }
      }
    }
  }
}
