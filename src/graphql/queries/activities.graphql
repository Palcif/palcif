query Activities($language: LanguageCodeFilterEnum!) {
  activities(first: 20, where: { language: $language, orderby: { field: DATE, order: DESC } }) {
    nodes {
      id
      title
      slug
      date
      featuredImage {
        node {
          sourceUrl
          altText
        }
      }
      activityFields {
        category
        summary
      }
    }
  }
}
