query BlogPosts($language: LanguageCodeFilterEnum!) {
  posts(first: 20, where: { language: $language, orderby: { field: DATE, order: DESC } }) {
    nodes {
      id
      title
      excerpt
      date
      slug
      author {
        node {
          name
        }
      }
      featuredImage {
        node {
          sourceUrl
          altText
        }
      }
    }
  }
}
